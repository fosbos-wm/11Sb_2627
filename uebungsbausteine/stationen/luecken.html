<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lückentext</title>
<style>
:root{--bg:#f2f5f7;--panel:#fff;--fg:#14222c;--muted:#566872;--line:#d3dde3;--pri:#0e5a77;--pri-ink:#fff;--soft:#e3eef3;--ok:#1b7f4b;--ok-soft:#d9f0e2;--bad:#b3261e;--bad-soft:#f9dedc;--warn:#8a5a00;--warn-soft:#fff1cf}
@media (prefers-color-scheme:dark){:root{--bg:#0f171c;--panel:#17232a;--fg:#e6eff3;--muted:#9bb0ba;--line:#2a3b44;--pri:#5fb8d9;--pri-ink:#062029;--soft:#1d3039;--ok:#6fd49b;--ok-soft:#163626;--bad:#ff9a92;--bad-soft:#40201e;--warn:#f0c060;--warn-soft:#3a2f12;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:14px max(14px,env(safe-area-inset-left,0px)) 40px}
h1{font-size:1.2rem;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 12px}
button{font:inherit;color:inherit}
.b{font-weight:600;font-size:.95rem;border-radius:10px;border:1px solid var(--pri);background:var(--pri);color:var(--pri-ink);padding:10px 18px;cursor:pointer}.b.alt{background:var(--panel);color:var(--fg);border-color:var(--line)}.b:disabled{opacity:.5;cursor:default}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}.stat{margin-left:auto;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.msg{margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-weight:600}.msg.n{background:var(--bad-soft);color:var(--bad)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
[hidden]{display:none!important}:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.txt{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;line-height:2.1;font-size:1rem}
.gap{display:inline-block;min-width:7em;padding:2px 10px;margin:0 2px;border-radius:8px;border:2px dashed var(--pri);background:var(--soft);cursor:pointer;vertical-align:baseline;line-height:1.5;text-align:center}
.gap.f{border-style:solid;font-weight:700}.gap.ready{background:var(--warn-soft);border-color:var(--warn)}
.gap.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);cursor:default}.gap.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding:12px;border-radius:14px;background:color-mix(in srgb,var(--line) 35%,transparent);min-height:52px}
.chip{padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600}
.chip.sel{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 30%,transparent)}
</style></head><body>
<h1 id="t">Lückentext</h1><p class="sub" id="a"></p>
<div class="txt" id="txt"></div><div class="bank" id="bank" aria-label="Wortspeicher"></div>
<div class="bar"><button class="b" id="chk" disabled type="button">Prüfen</button><button class="b alt" id="re" type="button">Von vorn</button><span class="stat" id="st"></span></div>
<div id="m" role="status"></div>
<script>
const QS=new URLSearchParams(location.search),TS=QS.get("ts")==="1",SET=(QS.get("set")||"").replace(/[^a-z0-9\-]/gi,"");
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rng(seed){let a=(seed*2654435761)>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sh(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const SEED=+QS.get("spiel")||Math.floor(Math.random()*99)+1;
function report(punkte,max,zuege,sekunden){if(!TS)return;try{parent.postMessage({tsResult:{punkte,max,zuege,sekunden}},"*")}catch(e){}}
const HINT=TS?" Zeige deiner Lehrkraft den Ergebniscode (oben).":"";
function load(cb){fetch("../inhalte/"+SET+".json").then(r=>r.json()).then(d=>{$("t").textContent=d.titel;$("a").textContent=d.anleitung;cb(d)}).catch(()=>{$("a").textContent="Die Übung konnte nicht geladen werden."})}
let D=null,G=[],segs=[],chips=[],fill={},sel=null,tries=0,first=null,done=false,t0=0,tick=null,secs=0,res=null;
function init(){
  segs=[];G=[];const parts=D.text.split(/\[\[(.+?)\]\]/);
  parts.forEach((p,i)=>{if(i%2===0)segs.push({t:p});else{segs.push({g:G.length});G.push(p)}});
  const r=rng(SEED);chips=sh(G.map((w,i)=>({id:i,w})).concat(D.extra.map((w,i)=>({id:100+i,w}))),r);
  fill={};sel=null;tries=0;first=null;done=false;res=null;secs=0;clearInterval(tick);tick=null;$("m").innerHTML="";draw();
}
function draw(){
  $("txt").innerHTML=segs.map(s=>{if(s.t!==undefined)return esc(s.t).replace(/\n\n/g,"<br><br>").replace(/\n/g,"<br>");
    const f=fill[s.g],c=res&&f!==undefined?(res[s.g]?" ok":" bad"):"";
    return `<button type="button" class="gap${f!==undefined?" f":""}${c}${sel!==null&&f===undefined?" ready":""}" data-g="${s.g}">${f!==undefined?esc(chips.find(x=>x.id===f).w):"&nbsp;"}</button>`}).join("");
  const used=new Set(Object.values(fill));
  $("bank").innerHTML=chips.filter(c=>!used.has(c.id)).map(c=>`<button type="button" class="chip${sel===c.id?" sel":""}" data-c="${c.id}">${esc(c.w)}</button>`).join("")||"<span class='sub'>Alle Wörter eingesetzt.</span>";
  $("chk").disabled=done||Object.keys(fill).length!==G.length;$("st").textContent=Object.keys(fill).length+" von "+G.length+" Lücken gefüllt";
  document.querySelectorAll("[data-c]").forEach(b=>b.addEventListener("click",()=>{if(done)return;sel=sel===+b.dataset.c?null:+b.dataset.c;draw()}));
  document.querySelectorAll("[data-g]").forEach(b=>b.addEventListener("click",()=>gap(+b.dataset.g)));
}
function gap(g){
  if(done)return;
  if(res&&res[g]&&fill[g]!==undefined)return;
  if(fill[g]!==undefined){delete fill[g];if(res)delete res[g];sel=null;$("m").innerHTML="";draw();return}
  if(sel===null)return;
  if(!tick){t0=Date.now();tick=setInterval(()=>{secs=Math.round((Date.now()-t0)/1000)},500)}
  fill[g]=sel;sel=null;draw();
}
$("chk").addEventListener("click",()=>{
  tries++;res={};let ok=0;G.forEach((w,g)=>{res[g]=chips.find(x=>x.id===fill[g]).w===w;if(res[g])ok++});
  if(first===null)first=ok;
  if(ok===G.length){done=true;clearInterval(tick);secs=Math.round((Date.now()-t0)/1000);draw();$("m").innerHTML=`<div class="msg">Der Text ist vollständig! ${tries===1?"Gleich beim ersten Versuch.":"Nach "+tries+" Prüfungen."}${HINT}</div>`;report(first,G.length,tries,secs)}
  else{draw();$("m").innerHTML=`<div class="msg n">${ok} von ${G.length} Lücken richtig. Falsche sind rot: tippe sie an, um das Wort zurückzulegen.</div>`}
});
$("re").addEventListener("click",()=>{if(!TS){const q=new URLSearchParams(location.search);q.set("spiel",String(Math.floor(Math.random()*99)+1));history.replaceState(null,"","?"+q);location.reload();return}init()});
load(d=>{D=d;init()});
</script></body></html>
