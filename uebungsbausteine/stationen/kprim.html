<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>K-Prim</title>
<style>
:root{--bg:#f2f5f7;--panel:#fff;--fg:#14222c;--muted:#566872;--line:#d3dde3;--pri:#0e5a77;--pri-ink:#fff;--ok:#1b7f4b;--ok-soft:#d9f0e2;--bad:#b3261e;--bad-soft:#f9dedc}
@media (prefers-color-scheme:dark){:root{--bg:#0f171c;--panel:#17232a;--fg:#e6eff3;--muted:#9bb0ba;--line:#2a3b44;--pri:#5fb8d9;--pri-ink:#062029;--ok:#6fd49b;--ok-soft:#163626;--bad:#ff9a92;--bad-soft:#40201e;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:14px max(14px,env(safe-area-inset-left,0px)) 40px;max-width:820px;margin-inline:auto}
h1{font-size:1.2rem;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 14px}
.task{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.task h2{font-size:1rem;margin:0 0 10px}
.st{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.st.ok{background:var(--ok-soft)}.st.bad{background:var(--bad-soft)}
.tf{display:flex;gap:6px}
.tf button{font:600 .85rem inherit;font-family:inherit;border:2px solid var(--line);background:var(--panel);color:var(--fg);border-radius:10px;padding:8px 12px;cursor:pointer;min-width:5.6em}
.tf button[aria-pressed="true"]{border-color:var(--pri);background:var(--pri);color:var(--pri-ink)}
.fb{grid-column:1/-1;font-size:.88rem;font-weight:600}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.b{font:600 .95rem inherit;font-family:inherit;border-radius:10px;border:1px solid var(--pri);background:var(--pri);color:var(--pri-ink);padding:10px 18px;cursor:pointer}.b.alt{background:var(--panel);color:var(--fg);border-color:var(--line)}.b:disabled{opacity:.5}
.vig{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--pri);border-radius:12px;padding:12px 16px;margin-bottom:14px}.vig h2{font-size:1rem;margin:0 0 6px}.vig p{margin:0;white-space:pre-line}
.sum{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-weight:700}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
</style></head><body>
<h1 id="t">K-Prim</h1><p class="sub" id="a"></p>
<div id="vig"></div>
<div id="tasks"></div>
<div class="bar"><button class="b" id="chk" disabled type="button">Prüfen</button><button class="b alt" id="again" type="button" hidden>Noch einmal</button><span class="sub" id="cnt" style="margin:0"></span></div>
<div id="sum" role="status"></div>
<script>
const QS=new URLSearchParams(location.search),TS=QS.get("ts")==="1",SET=(QS.get("set")||"").replace(/[^a-z0-9\-]/gi,"");
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let D=null,ans={},t0=0,tick=null,secs=0,checked=false,tries=0;
function render(){
  $("tasks").innerHTML=D.aufgaben.map((t,ti)=>`<section class="task"><h2>${ti+1}. ${esc(t.frage)}</h2>${t.statements.map((s,si)=>{const k=ti+"-"+si,v=ans[k];let c="",fb="";
    if(checked){const r=v===s.richtig;c=r?"ok":"bad";fb=`<div class="fb">${r?"richtig":"falsch"}: Die Aussage ${s.richtig?"trifft zu":"trifft nicht zu"}.${s.begruendung?" "+esc(s.begruendung):""}</div>`}
    return `<div class="st ${c}"><span>${esc(s.text)}</span><span class="tf"><button type="button" data-k="${k}" data-v="1" aria-pressed="${v===true}" ${checked?"disabled":""}>trifft zu</button><button type="button" data-k="${k}" data-v="0" aria-pressed="${v===false}" ${checked?"disabled":""}>trifft nicht zu</button></span>${fb}</div>`}).join("")}</section>`).join("");
  const n=Object.keys(ans).length,tot=D.aufgaben.reduce((a,t)=>a+t.statements.length,0);
  $("chk").disabled=checked||n!==tot;$("cnt").textContent=n+" von "+tot+" beantwortet";$("again").hidden=!checked;
  document.querySelectorAll("[data-k]").forEach(b=>b.addEventListener("click",()=>{if(!tick){t0=Date.now();tick=setInterval(()=>{secs=Math.round((Date.now()-t0)/1000)},500)}ans[b.dataset.k]=b.dataset.v==="1";render()}));
}
$("chk").addEventListener("click",()=>{
  checked=true;tries++;clearInterval(tick);secs=Math.round((Date.now()-t0)/1000);
  let ok=0,tot=0;D.aufgaben.forEach((t,ti)=>t.statements.forEach((s,si)=>{tot++;if(ans[ti+"-"+si]===s.richtig)ok++}));
  render();$("sum").innerHTML=`<div class="sum">${ok} von ${tot} Aussagen richtig.${TS?" Zeige deiner Lehrkraft den Ergebniscode (oben).":""}</div>`;
  if(TS)try{parent.postMessage({tsResult:{punkte:ok,max:tot,zuege:tries,sekunden:secs}},"*")}catch(e){}
});
$("again").addEventListener("click",()=>{ans={};checked=false;secs=0;tick=null;$("sum").innerHTML="";render()});
fetch("../inhalte/"+SET+".json").then(r=>r.json()).then(d=>{D=d;if(d.teile){const n=Math.max(1,parseInt(QS.get("spiel"))||1),t=d.teile[(n-1)%d.teile.length];d=Object.assign({},d,t,{titel:"K-Prim "+((n-1)%d.teile.length+1)+": "+t.titel,anleitung:"Entscheide bei jeder Aussage, ob sie zutrifft oder nicht."});D=d;}$("t").textContent=d.titel;if(d.vignette)$("vig").innerHTML=`<section class="vig"><h2>Fallvignette: ${esc(d.vignette_titel||"")}</h2><p>${esc(d.vignette)}</p></section>`;$("a").textContent=d.anleitung;render()}).catch(()=>{$("a").textContent="Die Übung konnte nicht geladen werden."});
</script></body></html>
