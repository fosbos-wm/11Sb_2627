<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Memory</title>
<style>
:root{--bg:#f2f5f7;--panel:#fff;--fg:#14222c;--muted:#566872;--line:#d3dde3;--pri:#0e5a77;--pri-ink:#fff;--soft:#e3eef3;--ok:#1b7f4b;--ok-soft:#d9f0e2;--bad:#b3261e;--bad-soft:#f9dedc;--warn:#8a5a00;--warn-soft:#fff1cf}
@media (prefers-color-scheme:dark){:root{--bg:#0f171c;--panel:#17232a;--fg:#e6eff3;--muted:#9bb0ba;--line:#2a3b44;--pri:#5fb8d9;--pri-ink:#062029;--soft:#1d3039;--ok:#6fd49b;--ok-soft:#163626;--bad:#ff9a92;--bad-soft:#40201e;--warn:#f0c060;--warn-soft:#3a2f12;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:14px max(14px,env(safe-area-inset-left,0px)) 40px}
h1{font-size:1.2rem;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 12px}
button{font:inherit;color:inherit}
.b{font-weight:600;font-size:.95rem;border-radius:10px;border:1px solid var(--pri);background:var(--pri);color:var(--pri-ink);padding:10px 18px;cursor:pointer}.b.alt{background:var(--panel);color:var(--fg);border-color:var(--line)}.b:disabled{opacity:.5;cursor:default}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}.stat{margin-left:auto;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.msg{margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-weight:600}.msg.n{background:var(--bad-soft);color:var(--bad)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
[hidden]{display:none!important}:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{position:relative;perspective:700px;min-height:110px;padding:0;border:0;background:none;cursor:pointer}
.in{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.card.open .in,.card.done .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;overflow:hidden}
.back{background:var(--pri);color:var(--pri-ink);font-size:1.8rem;font-weight:800;background-image:repeating-linear-gradient(45deg,transparent 0 8px,rgba(255,255,255,.12) 8px 16px)}
.front{background:var(--panel);transform:rotateY(180deg);font-size:.88rem;line-height:1.25;hyphens:auto}
.front.term{background:var(--soft);font-weight:800;font-size:1rem;border-color:var(--pri)}
.card.done .front{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.card.shake .in{animation:sh .35s}@keyframes sh{25%{transform:rotateY(180deg) translateX(-5px)}75%{transform:rotateY(180deg) translateX(5px)}}
.card{aspect-ratio:1/.8}
</style></head><body>
<h1 id="t">Memory</h1><p class="sub" id="a"></p>
<div class="grid" id="g"></div>
<div class="bar"><button class="b alt" id="re" type="button">Neu mischen</button><span class="stat" id="st"></span></div>
<div id="m" role="status"></div>
<script>
const QS=new URLSearchParams(location.search),TS=QS.get("ts")==="1",SET=(QS.get("set")||"").replace(/[^a-z0-9\-]/gi,"");
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rng(seed){let a=(seed*2654435761)>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sh(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const SEED=+QS.get("spiel")||Math.floor(Math.random()*99)+1;
function report(punkte,max,zuege,sekunden){if(!TS)return;try{parent.postMessage({tsResult:{punkte,max,zuege,sekunden}},"*")}catch(e){}}
const HINT=TS?" Zeige deiner Lehrkraft den Ergebniscode (oben).":"";
function load(cb){fetch("../inhalte/"+SET+".json").then(r=>r.json()).then(d=>{$("t").textContent=d.titel;$("a").textContent=d.anleitung;cb(d)}).catch(()=>{$("a").textContent="Die Übung konnte nicht geladen werden."})}
let P=[],C=[],open=[],lock=false,moves=0,found=0,t0=0,tick=null,secs=0;
function init(){
  const r=rng(SEED);C=[];P.forEach((p,i)=>{C.push({p:i,term:true,t:p[0]});C.push({p:i,term:false,t:p[1]})});C=sh(C,r);
  open=[];lock=false;moves=0;found=0;secs=0;clearInterval(tick);tick=null;$("m").innerHTML="";draw();stat();
}
function draw(){
  $("g").innerHTML=C.map((c,i)=>`<button type="button" class="card${c.done?" done":""}${open.includes(i)?" open":""}" data-i="${i}" aria-label="Karte ${i+1}"><span class="in"><span class="face back">?</span><span class="face front${c.term?" term":""}">${esc(c.t)}</span></span></button>`).join("");
  document.querySelectorAll(".card").forEach(b=>b.addEventListener("click",()=>flip(+b.dataset.i)));
}
function stat(){$("st").textContent=found+" von "+P.length+" Paaren · "+moves+" Züge"}
function flip(i){
  if(lock||C[i].done||open.includes(i))return;
  if(!tick){t0=Date.now();tick=setInterval(()=>{secs=Math.round((Date.now()-t0)/1000)},500)}
  open.push(i);const el=document.querySelector(`[data-i="${i}"]`);el.classList.add("open");
  if(open.length<2)return;
  moves++;const [a,b]=open;lock=true;
  if(C[a].p===C[b].p&&C[a].term!==C[b].term){
    setTimeout(()=>{C[a].done=C[b].done=true;found++;open=[];lock=false;draw();stat();if(found===P.length)finish()},500);
  }else{
    document.querySelectorAll(".card.open").forEach(x=>x.classList.add("shake"));
    setTimeout(()=>{open=[];lock=false;draw();stat()},1100);
  }
  stat();
}
function finish(){
  clearInterval(tick);secs=Math.round((Date.now()-t0)/1000);
  $("m").innerHTML=`<div class="msg">Geschafft: ${P.length} Paare in ${moves} Zügen und ${Math.floor(secs/60)}:${String(secs%60).padStart(2,"0")} min.${HINT}</div>`;
  report(P.length,P.length,moves,secs);
}
$("re").addEventListener("click",()=>{if(!TS){const q=new URLSearchParams(location.search);q.set("spiel",String(Math.floor(Math.random()*99)+1));history.replaceState(null,"","?"+q);location.reload();return}init()});
load(d=>{P=d.paare;init()});
</script></body></html>
