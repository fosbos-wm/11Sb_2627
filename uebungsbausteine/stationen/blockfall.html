<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blockfall</title>
<style>
:root{--bg:#f2f5f7;--panel:#fff;--fg:#14222c;--muted:#566872;--line:#d3dde3;--pri:#0e5a77;--pri-ink:#fff;--soft:#e3eef3;--ok:#1b7f4b;--ok-soft:#d9f0e2;--bad:#b3261e;--bad-soft:#f9dedc;--warn:#8a5a00;--warn-soft:#fff1cf}
@media (prefers-color-scheme:dark){:root{--bg:#0f171c;--panel:#17232a;--fg:#e6eff3;--muted:#9bb0ba;--line:#2a3b44;--pri:#5fb8d9;--pri-ink:#062029;--soft:#1d3039;--ok:#6fd49b;--ok-soft:#163626;--bad:#ff9a92;--bad-soft:#40201e;--warn:#f0c060;--warn-soft:#3a2f12;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:14px max(14px,env(safe-area-inset-left,0px)) 40px}
h1{font-size:1.2rem;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 12px}
button{font:inherit;color:inherit}
.b{font-weight:600;font-size:.95rem;border-radius:10px;border:1px solid var(--pri);background:var(--pri);color:var(--pri-ink);padding:10px 18px;cursor:pointer}.b.alt{background:var(--panel);color:var(--fg);border-color:var(--line)}.b:disabled{opacity:.5;cursor:default}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}.stat{margin-left:auto;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.msg{margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-weight:600}.msg.n{background:var(--bad-soft);color:var(--bad)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
[hidden]{display:none!important}:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.arena{position:relative;height:min(46vh,380px);min-height:260px;background:var(--panel);border:2px solid var(--line);border-radius:14px;overflow:hidden}
.blk{position:absolute;left:50%;top:0;width:min(92%,520px);transform:translate(-50%,0);padding:12px 14px;border-radius:12px;background:var(--soft);border:2px solid var(--pri);font-weight:600;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.15);will-change:transform}
.blk.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}.blk.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.floor{position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--bad)}
.cols{display:grid;gap:8px;margin-top:10px}
.col{border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:14px 8px;font-weight:800;cursor:pointer;text-align:center;min-height:56px}
.col .k{display:block;font:700 .7rem ui-monospace,monospace;color:var(--muted)}
.col.sel{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 30%,transparent)}
.col.ok{background:var(--ok-soft);border-color:var(--ok)}.col.bad{background:var(--bad-soft);border-color:var(--bad)}
.start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:color-mix(in srgb,var(--bg) 88%,transparent);text-align:center;padding:16px}
.rev{margin:10px 0 0;padding:0;list-style:none}.rev li{padding:8px 10px;border-radius:8px;background:var(--bad-soft);margin-bottom:6px;font-size:.92rem}.rev b{color:var(--bad)}
</style></head><body>
<h1 id="t">Blockfall</h1><p class="sub" id="a"></p>
<div class="arena" id="ar"><div class="floor"></div><div class="blk" id="blk" hidden></div>
 <div class="start" id="start"><div>Sortiere jeden fallenden Block in die richtige Spalte, bevor er unten ankommt.<br>Tippe die Spalte an (oder drücke die Taste 1, 2, 3).</div><button class="b" id="go" type="button">Start</button></div></div>
<div class="cols" id="cols"></div>
<div class="bar"><span class="stat" id="st" style="margin-left:0"></span></div>
<div id="m" role="status"></div>
<script>
const QS=new URLSearchParams(location.search),TS=QS.get("ts")==="1",SET=(QS.get("set")||"").replace(/[^a-z0-9\-]/gi,"");
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rng(seed){let a=(seed*2654435761)>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sh(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const SEED=+QS.get("spiel")||Math.floor(Math.random()*99)+1;
function report(punkte,max,zuege,sekunden){if(!TS)return;try{parent.postMessage({tsResult:{punkte,max,zuege,sekunden}},"*")}catch(e){}}
const HINT=TS?" Zeige deiner Lehrkraft den Ergebniscode (oben).":"";
function load(cb){fetch("../inhalte/"+SET+".json").then(r=>r.json()).then(d=>{$("t").textContent=d.titel;$("a").textContent=d.anleitung;cb(d)}).catch(()=>{$("a").textContent="Die Übung konnte nicht geladen werden."})}
let D=null,Q=[],i=0,fehler=0,richtig=0,t0=0,secs=0,raf=null,y0=0,dur=0,placed=false,wrong=[];
const N_MAX=15;
function setup(){
  const r=rng(SEED);Q=sh(D.items,r).slice(0,N_MAX);
  $("cols").style.gridTemplateColumns="repeat("+D.kategorien.length+",1fr)";
  $("cols").innerHTML=D.kategorien.map((k,j)=>`<button type="button" class="col" data-k="${j}"><span class="k">${j+1}</span>${esc(k)}</button>`).join("");
  document.querySelectorAll(".col").forEach(b=>b.addEventListener("click",()=>place(+b.dataset.k)));
  i=0;fehler=0;richtig=0;wrong=[];$("m").innerHTML="";$("start").hidden=false;$("blk").hidden=true;stat();
}
function stat(){$("st").textContent="Block "+Math.min(i+1,Q.length)+" von "+Q.length+" · richtig "+richtig+" · Fehler "+fehler}
function next(){
  if(i>=Q.length)return end();
  const it=Q[i],b=$("blk");b.className="blk";b.textContent=it.t;b.hidden=false;placed=false;
  dur=Math.max(5200,11000-i*450);y0=performance.now();stat();cancelAnimationFrame(raf);loop();
}
function loop(){
  const ar=$("ar"),b=$("blk"),f=(performance.now()-y0)/dur,maxY=ar.clientHeight-b.offsetHeight-6;
  b.style.transform="translate(-50%,"+Math.min(1,f)*maxY+"px)";
  if(f>=1&&!placed){result(-1);return}
  raf=requestAnimationFrame(loop);
}
function mark(j,cls){const c=document.querySelectorAll(".col")[j];if(!c)return;c.classList.add(cls);setTimeout(()=>c.classList.remove(cls),700)}
function result(k){
  if(placed)return;placed=true;cancelAnimationFrame(raf);
  const it=Q[i],b=$("blk");
  if(k===it.k){richtig++;b.classList.add("ok");mark(k,"ok")}
  else{fehler++;b.classList.add("bad");mark(it.k,"ok");if(k>=0)mark(k,"bad");wrong.push({t:it.t,k:D.kategorien[it.k]})}
  i++;stat();setTimeout(next,k===it.k?450:1300);
}
function place(k){if(!t0||placed||$("blk").hidden)return;result(k)}
function end(){
  $("blk").hidden=true;secs=Math.round((Date.now()-t0)/1000);t0=0;
  let h=`<div class="msg${fehler>richtig?" n":""}">${richtig} von ${Q.length} richtig, ${fehler} Fehler, ${Math.floor(secs/60)}:${String(secs%60).padStart(2,"0")} min.${HINT}</div>`;
  if(wrong.length)h+=`<ul class="rev">${wrong.map(w=>`<li>${esc(w.t)}<br><b>→ ${esc(w.k)}</b></li>`).join("")}</ul>`;
  h+=`<div class="bar"><button class="b alt" id="again" type="button">Noch einmal</button></div>`;
  $("m").innerHTML=h;$("again").addEventListener("click",()=>{if(TS){setup()}else{const q=new URLSearchParams(location.search);q.set("spiel",String(Math.floor(Math.random()*99)+1));history.replaceState(null,"","?"+q);location.reload()}});
  report(richtig,Q.length,fehler,secs);
}
$("go").addEventListener("click",()=>{$("start").hidden=true;t0=Date.now();next()});
document.addEventListener("keydown",e=>{if(!D)return;const n=+e.key;if(n>=1&&n<=D.kategorien.length)place(n-1)});
load(d=>{D=d;setup()});
</script></body></html>
