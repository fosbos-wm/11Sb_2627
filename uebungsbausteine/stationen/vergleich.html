<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Theorievergleich</title>
<style>
:root{--bg:#f2f5f7;--panel:#fff;--fg:#14222c;--muted:#566872;--line:#d3dde3;--pri:#0e5a77;--pri-ink:#fff;--soft:#e3eef3;--ok:#1b7f4b;--ok-soft:#d9f0e2;--bad:#b3261e;--bad-soft:#f9dedc;--warn:#8a5a00;--warn-soft:#fff1cf}
@media (prefers-color-scheme:dark){:root{--bg:#0f171c;--panel:#17232a;--fg:#e6eff3;--muted:#9bb0ba;--line:#2a3b44;--pri:#5fb8d9;--pri-ink:#062029;--soft:#1d3039;--ok:#6fd49b;--ok-soft:#163626;--bad:#ff9a92;--bad-soft:#40201e;--warn:#f0c060;--warn-soft:#3a2f12;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:14px max(14px,env(safe-area-inset-left,0px)) 40px}
h1{font-size:1.2rem;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 12px}
button{font:inherit;color:inherit}
.b{font-weight:600;font-size:.95rem;border-radius:10px;border:1px solid var(--pri);background:var(--pri);color:var(--pri-ink);padding:10px 18px;cursor:pointer}.b.alt{background:var(--panel);color:var(--fg);border-color:var(--line)}.b:disabled{opacity:.5;cursor:default}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}.stat{margin-left:auto;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.msg{margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-weight:600}.msg.n{background:var(--bad-soft);color:var(--bad)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
[hidden]{display:none!important}:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.cols{display:grid;gap:10px;margin-bottom:12px}
.col{border:2px dashed var(--line);border-radius:14px;padding:10px;background:var(--panel);min-height:120px;cursor:pointer}
.col.ready{border-color:var(--pri);background:var(--soft)}
.col h2{font-size:.95rem;margin:0 0 8px;color:var(--pri)}
.pool{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:14px;background:color-mix(in srgb,var(--line) 35%,transparent);min-height:60px}
.k{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--panel);cursor:pointer;font-size:.93rem;line-height:1.3}
.col .k{margin-bottom:6px}
.k.sel{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 30%,transparent)}
.k.ok{background:var(--ok-soft);border-color:var(--ok);cursor:default}.k.bad{background:var(--bad-soft);border-color:var(--bad)}
.lab{font:700 .72rem ui-monospace,monospace;letter-spacing:.05em;color:var(--muted);margin:12px 0 6px;text-transform:uppercase}
</style></head><body>
<h1 id="t">Theorievergleich</h1><p class="sub" id="a"></p>
<div class="cols" id="cols"></div>
<div class="lab" id="plab"></div><div class="pool" id="pool"></div>
<div class="bar"><button class="b" id="chk" disabled type="button">Prüfen</button><button class="b alt" id="re" type="button">Von vorn</button><span class="stat" id="st"></span></div>
<div id="m" role="status"></div>
<script>
const QS=new URLSearchParams(location.search),TS=QS.get("ts")==="1",SET=(QS.get("set")||"").replace(/[^a-z0-9\-]/gi,"");
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rng(seed){let a=(seed*2654435761)>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sh(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const SEED=+QS.get("spiel")||Math.floor(Math.random()*99)+1;
function report(punkte,max,zuege,sekunden){if(!TS)return;try{parent.postMessage({tsResult:{punkte,max,zuege,sekunden}},"*")}catch(e){}}
const HINT=TS?" Zeige deiner Lehrkraft den Ergebniscode (oben).":"";
function load(cb){fetch("../inhalte/"+SET+".json").then(r=>r.json()).then(d=>{$("t").textContent=d.titel;$("a").textContent=d.anleitung;cb(d)}).catch(()=>{$("a").textContent="Die Übung konnte nicht geladen werden."})}
let D=null,K=[],place={},sel=null,tries=0,first=null,done=false,t0=0,tick=null,secs=0,res=null;
function init(){
  const r=rng(SEED);K=sh(D.karten.map((k,i)=>({i,t:k.t,s:k.s})),r);place={};sel=null;tries=0;first=null;done=false;res=null;secs=0;clearInterval(tick);tick=null;$("m").innerHTML="";draw();
}
function card(k,extra){const c=res?(res[k.i]?" ok":" bad"):"";return `<button type="button" class="k${sel===k.i?" sel":""}${c}" data-c="${k.i}">${esc(k.t)}</button>`}
function draw(){
  $("cols").style.gridTemplateColumns="repeat("+D.spalten.length+",minmax(0,1fr))";
  if(window.innerWidth<560)$("cols").style.gridTemplateColumns="1fr";
  $("cols").innerHTML=D.spalten.map((s,j)=>`<div class="col${sel!==null?" ready":""}" data-s="${j}"><h2>${esc(s)}</h2>${K.filter(k=>place[k.i]===j).map(card).join("")}</div>`).join("");
  const pool=K.filter(k=>place[k.i]===undefined);
  $("plab").textContent=pool.length?"Noch zu sortieren ("+pool.length+")":"";$("pool").innerHTML=pool.map(card).join("");$("pool").style.display=pool.length?"":"none";
  $("chk").disabled=done||pool.length>0;$("st").textContent=(K.length-pool.length)+" von "+K.length+" sortiert";
  document.querySelectorAll("[data-c]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();tap(+b.dataset.c)}));
  document.querySelectorAll("[data-s]").forEach(b=>b.addEventListener("click",()=>drop(+b.dataset.s)));
}
function tap(i){
  if(done)return;
  if(res&&res[i]){return}
  if(sel!==null&&place[i]!==undefined&&sel!==i){drop(place[i]);return}
  if(place[i]!==undefined){delete place[i];if(res){delete res[i]}sel=null;$("m").innerHTML="";draw();return}
  sel=sel===i?null:i;draw();
}
function drop(j){if(done||sel===null)return;if(!tick){t0=Date.now();tick=setInterval(()=>{secs=Math.round((Date.now()-t0)/1000)},500)}place[sel]=j;sel=null;draw()}
$("chk").addEventListener("click",()=>{
  tries++;res={};let ok=0;K.forEach(k=>{res[k.i]=place[k.i]===k.s;if(res[k.i])ok++});
  if(first===null)first=ok;
  if(ok===K.length){done=true;clearInterval(tick);secs=Math.round((Date.now()-t0)/1000);draw();$("m").innerHTML=`<div class="msg">Alles richtig! ${tries===1?"Gleich beim ersten Versuch.":"Nach "+tries+" Prüfungen."}${HINT}</div>`;report(first,K.length,tries,secs)}
  else{draw();$("m").innerHTML=`<div class="msg n">${ok} von ${K.length} richtig. Falsche Karten sind rot: tippe sie an, um sie zurückzulegen, und sortiere sie neu.</div>`}
});
$("re").addEventListener("click",()=>{if(!TS){const q=new URLSearchParams(location.search);q.set("spiel",String(Math.floor(Math.random()*99)+1));history.replaceState(null,"","?"+q);location.reload();return}init()});
window.addEventListener("resize",()=>{if(D)draw()});
load(d=>{D=d;init()});
</script></body></html>
